<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonjour · 学法语 Français A1</title>
<style>
:root{--bg:#f3f7ff;--card:#fff;--ink:#22304a;--mut:#74809a;--red:#e63946;--blue:#2f5fa8;--ok:#2bb673;--gold:#f4a300}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:linear-gradient(90deg,#2f5fa8,#4a7bc8);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0;cursor:pointer;flex:1;white-space:nowrap}header span,header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer}
#hp{height:4px;background:rgba(255,255,255,.25);width:100%}#hp i{display:block;height:100%;background:#ffd166;width:0;transition:width .6s}
#app{max-width:760px;margin:0 auto;padding:14px}#crumb{max-width:760px;margin:6px auto 0;padding:0 14px;font-size:.85rem;color:var(--mut)}#crumb a{color:var(--blue);cursor:pointer}
.hm{display:grid;gap:14px}.hm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hm-card{background:#fff;border:1px solid #e3e9f5;border-radius:14px;padding:12px 14px}.hm-lab{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.hm-val{font-size:1.3rem;font-weight:800;margin:2px 0 8px}.hm-val small{font-size:.8rem;font-weight:600;color:var(--mut)}.hm-sub{font-size:.78rem;color:var(--mut);margin-top:8px}
.hm-bar,.bar{height:5px;background:#e8edf7;border-radius:4px;overflow:hidden}.hm-bar i,.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .5s}
.hm-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.hm-act{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid #e3e9f5;cursor:pointer;font-weight:700;min-height:54px}
.hm-act small{display:block;font-weight:500;font-size:.78rem;color:var(--mut)}.hm-act.main{background:var(--blue);color:#fff;border-color:var(--blue)}.hm-act.main small{color:#d6e4ff}.hm-act.ok{background:#f1faf5;cursor:default;color:var(--mut)}
.hm-sec h2{display:flex;align-items:center;gap:8px;font-size:1.02rem;margin:0 0 8px}.hm-sec h2 small{margin-left:auto;font-size:.78rem;color:var(--mut)}
.hm-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:.78rem}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.hm-t{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;align-items:center;background:#fff;border:1px solid #e3e9f5;border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:58px}
.hm-t:hover{box-shadow:0 2px 8px #0002}.hm-t .ic{font-size:1.55rem;text-align:center}.hm-t b{font-size:.88rem;font-weight:600;line-height:1.2}
.hm-t .meta{display:flex;align-items:center;gap:8px;margin-top:7px}.hm-t .meta .hm-bar{flex:1}.hm-t .meta span{font-size:.72rem;color:var(--mut);min-width:28px;text-align:right}.hm-t.done .meta span{color:var(--ok);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tile{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 0 #0001;cursor:pointer;text-align:center;border-top:5px solid var(--blue)}.tile span{font-size:1.8rem;display:block}.tile small{display:block;color:var(--mut)}
.q{background:var(--card);border-radius:18px;padding:20px;text-align:center;box-shadow:0 4px 0 #0001}
.emo{font-size:3.4rem;line-height:1.1}.fw{font-size:2rem;font-weight:700}.zh{font-size:2rem}.ipa{color:var(--mut)}
.opts{display:grid;gap:8px;margin-top:12px}.opts button{font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid #0002;background:#fff;cursor:pointer}.opts button small{display:block;color:var(--mut);font-size:.8rem}
.opts button.ok{background:#d6f5e3;border-color:var(--ok)}.opts button.bad{background:#fbdcdc;border-color:var(--red)}
button{font:inherit}.nav{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.nav button,.alt,.speak{padding:9px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}.alt{background:#8d99ae}.speak{background:var(--gold)}
.pill{background:var(--blue);color:#fff;border-radius:99px;padding:3px 12px;font-size:.85rem}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.fb{margin-top:12px;padding:10px;border-radius:10px;background:#eef2fa;text-align:left}.evd{color:var(--mut);font-size:.85rem;margin-top:4px}
input.t{width:100%;font-size:1.2rem;padding:10px;border-radius:10px;border:2px solid #0003;margin-top:10px;text-align:center}
.seq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:44px;margin:8px 0;padding:6px;border-radius:10px;background:#0000000a}.chip{padding:8px 12px;border-radius:10px;background:#fff;border:2px solid #0002;cursor:pointer;font-size:1.1rem}.chip.on{background:#dbe8f7}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:6px;box-shadow:0 1px 0 #0001}.row .rv{font-size:1.7rem;width:40px;text-align:center;cursor:pointer}.row .rt{flex:1;cursor:pointer}.row .rt small{display:block;color:var(--mut)}
.row input{width:22px;height:22px}.rowp{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}.rowp .rt{flex:1}
select{font:inherit;padding:4px;border-radius:8px}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;z-index:9}
.cf{position:fixed;width:8px;height:8px;border-radius:2px;z-index:9;animation:cf 1.1s ease-out forwards;pointer-events:none}@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.flt{position:fixed;z-index:9;color:var(--gold);animation:fl 1s forwards;pointer-events:none}@keyframes fl{to{transform:translateY(-50px);opacity:0}}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:700px){.hm-stats{grid-template-columns:1fr 1fr}.hm-stats .hm-me{grid-column:1/-1}.hm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><h1 onclick="home()">🥖 Bonjour ! 学法语 A1</h1><span id="xp"></span><span id="streak"></span><button id="spd" onclick="cycSpd()"></button></header><div id="hp"><i></i></div>
<div id="crumb"></div><div id="app"></div>
<script src="data-fr.js"></script>
<script src="data-fr2.js"></script>
<script src="audio-fr/map.js"></script>
<script>
const $=document.getElementById("app");
const MODS={phr:{id:"m:phr",mod:true,name:"Phrases utiles · 常用句子",icon:"🧩",color:"#3a6ea5",n:20,items:{length:20}}};
const unit=id=>id.startsWith("m:")?MODS[id.slice(2)]:CATS.find(c=>c.id===id);
const flatIds=()=>STEPS.flatMap(s=>s[1]);const ALL=()=>flatIds().map(unit);const words=()=>ALL().filter(u=>!u.mod);
const K="frA1";let S;try{S=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
S=Object.assign({known:{},ev:{},best:{},test:{},rev:{},done:{},xp:0,streak:0,sp:1,phr:0,pace:5,unit:"day"},S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const strip=x=>x.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const norm=x=>strip(x).replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,"").replace(/\s+/g," ").trim();
const nk=x=>x.toLowerCase();const esc=s=>s.replace(/'/g,"\\'");
function addD(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}const tdy=()=>addD(0);
/* ---- voix : MP3 Microsoft (Denise, voix neuronale) puis repli sur voix « Natural » du navigateur ---- */
const AU=new Audio();let TOK=0;
function say(t){if(!t)return;const tok=++TOK;try{speechSynthesis.cancel()}catch(e){}
  const f=window.AMAP&&AMAP[t];if(f){AU.src="audio-fr/"+f;AU.playbackRate=[.7,.85,1][S.sp];AU.onerror=()=>{if(tok===TOK)tts(t)};const p=AU.play();if(p)p.catch(()=>{if(tok===TOK)tts(t)});return}tts(t)}
function tts(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=[.6,.8,.95][S.sp];const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("fr")),v=vs.find(v=>/Natural|Online/i.test(v.name))||vs[0];if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function cycSpd(){S.sp=(S.sp+1)%3;save();head()}
function beep(ok){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:200;g.gain.value=.07;o.start();o.stop(c.currentTime+.15)}catch(e){}}
function fanfare(){try{const c=new AudioContext();[523,659,784,1046].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.connect(g);g.connect(c.destination);o.frequency.value=f;const t=c.currentTime+i*.11;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)})}catch(e){}}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function burst(x,y,n=22){for(let i=0;i<n;i++){const p=document.createElement("i");p.className="cf";p.style.cssText=`left:${x}px;top:${y}px;background:hsl(${Math.random()*360},90%,58%);--dx:${(Math.random()-.5)*(n>30?700:260)}px;--dy:${-60-Math.random()*(n>30?420:200)}px`;document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}}
function fxEl(el,ok,txt){if(!el)return;const r=el.getBoundingClientRect();if(ok){burst(r.left+r.width/2,r.top+r.height/2);const e=document.createElement("b");e.className="flt";e.textContent=txt;e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}else{el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),400)}}
function celebrate(m){fanfare();burst(innerWidth/2,innerHeight/2,60);toast(m)}
/* ---- XP, niveaux, série ---- */
const lvOf=x=>Math.floor(Math.sqrt(x/40))+1;
function touchStreak(){const t=tdy();if(S.last===t)return;S.streak=(S.last===addD(-1))?(S.streak||0)+1:1;S.last=t}
function addXp(n){const a=lvOf(S.xp);S.xp+=n;touchStreak();save();head();const b=lvOf(S.xp);if(b>a){fanfare();burst(innerWidth/2,innerHeight/3,50);toast("⬆️ Niveau "+b+" atteint ! 升级了！")}}
/* ---- maîtrise, stats, ETA ---- */
const mastery=c=>{if(c.mod)return Math.min(100,(S.phr||0)/c.n*100);const v=[(S.known[c.id]||[]).length/c.items.length*100];if(S.best[c.id])v.push(S.best[c.id]);if(S.test[c.id]!=null)v.push(S.test[c.id]);return v.reduce((a,b)=>a+b)/v.length};
const estF=c=>c.mod?mastery(c)/100:Math.max((S.known[c.id]||[]).length/c.items.length,S.test[c.id]!=null?S.test[c.id]/100:0);
function stats(){const rows=ALL().map(c=>({c,m:mastery(c),rem:c.items.length*(1-estF(c))}));const tot=rows.reduce((n,r)=>n+r.c.items.length,0),rem=rows.reduce((n,r)=>n+r.rem,0);return{all:rows.reduce((n,r)=>n+r.m,0)/rows.length,tot,rem,done:rows.filter(r=>r.m>=85).length,n:rows.length,rows}}
const goalDay=()=>Math.max(1,Math.round(S.unit==="week"?S.pace/7:S.pace));
function eta(st){const wpd=S.unit==="week"?S.pace/7:S.pace;if(st.rem<st.tot*.08)return null;const d=Math.ceil(st.rem*1.25/wpd);return{d,dur:d>=14?"~"+Math.ceil(d/7)+" semaines":"~"+d+" jour"+(d>1?"s":""),date:new Date(Date.now()+d*864e5).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}}
function checkDone(){const n=[];ALL().forEach(c=>{if(!S.done[c.id]&&mastery(c)>=85){S.done[c.id]=1;n.push(c.name)}});if(n.length){save();celebrate("🎓 Chapitre validé : "+n.join(", ")+" !")}}
/* ---- répétition espacée ---- */
const INTV=[0,1,2,4,8,16,32];
function srs(h,ok){const k=nk(h),e=S.rev[k];if(ok){const b=e?Math.min(e.b+1,6):1;S.rev[k]={b,d:addD(INTV[b])};if(b===4&&(!e||e.b<4))setTimeout(()=>toast("🧠 Mot ancré : "+h),900)}else S.rev[k]={b:0,d:tdy()}}
function dueItems(){const t=tdy(),seen={},out=[];words().forEach(c=>c.items.forEach(it=>{const k=nk(it[0]),e=S.rev[k];if(e&&e.d<=t&&!seen[k]){seen[k]=1;out.push({it,c,d:e.d})}}));return out.sort((a,b)=>a.d<b.d?-1:1)}
function setKnown(cid,h,on){const a=S.known[cid]=S.known[cid]||[],i=a.indexOf(h);if(on&&i<0){a.push(h);S.day=S.day&&S.day.d===tdy()?S.day:{d:tdy(),n:0};S.day.n++;if(!S.rev[nk(h)])S.rev[nk(h)]={b:0,d:addD(1)}}else if(!on&&i>=0)a.splice(i,1);save()}
/* ---- navigation / accueil ---- */
let cat,Q,cur;
function head(){document.getElementById("xp").textContent="⭐ "+S.xp+" XP";document.getElementById("streak").textContent="🔥 "+(S.streak||0);document.getElementById("spd").textContent="🔊 "+["très lent","lent","normal"][S.sp];document.querySelector("#hp i").style.width=stats().all+"%"}
function crumb(p){const c=document.getElementById("crumb");c.innerHTML=p.map(([t,f])=>f?`<a onclick="${f}()">${t}</a>`:`<b>${t}</b>`).join(" › ");window.scrollTo(0,0)}
const bar=p=>`<div class="hm-bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
function tile(id){const c=unit(id),m=mastery(c),ok=m>=85;return`<div class="hm-t${ok?" done":""}" style="--c:${c.color}" onclick="openAny('${id}')"><div class="ic">${c.icon}</div><div><b>${c.name}</b><div class="meta">${bar(m)}<span>${ok?"✓":Math.round(m)+"%"}</span></div></div></div>`}
const nextUnit=()=>ALL().find(u=>mastery(u)<60);
function openAny(id){const u=unit(id);if(u.mod)phrases();else menu(id)}
function home(){cur=home;cat=null;head();crumb([]);const st=stats(),E=eta(st),L=lvOf(S.xp),lo=40*(L-1)**2,hi=40*L*L,dn=S.day&&S.day.d===tdy()?S.day.n:0,gd=goalDay(),due=dueItems().length,nx=nextUnit();
  const acts=(nx?`<div class="hm-act main" onclick="openAny('${nx.id}')"><span style="font-size:1.4rem">▶</span><div>Continuer · 继续<small>${nx.icon} ${nx.name}</small></div></div>`:`<div class="hm-act ok">🎉 Parcours A1 terminé !</div>`)+
   (due?`<div class="hm-act" onclick="revStart()"><span style="font-size:1.4rem">🔁</span><div>Révision du jour · 今日复习<small>${due} mot${due>1?"s":""} à revoir</small></div></div>`:(Object.keys(S.rev).length?`<div class="hm-act ok"><span style="font-size:1.4rem">✅</span><div>Révisions à jour<small>Rien à revoir aujourd'hui</small></div></div>`:""));
  $.innerHTML=`<div class="hm"><div class="hm-stats"><div class="hm-card hm-me"><div class="hm-lab">Niveau · 等级</div><div class="hm-val">Niveau ${L} <small>· ⭐ ${S.xp} XP</small></div>${bar((S.xp-lo)/(hi-lo)*100)}</div>
  <div class="hm-card"><div class="hm-lab">Aujourd'hui · 今天</div><div class="hm-val">${dn}<small> / ${gd} mots</small></div>${bar(dn/gd*100)}<div class="hm-sub">🔥 ${S.streak||0} jour${S.streak>1?"s":""} de suite</div></div>
  <div class="hm-card" onclick="plan()" style="cursor:pointer"><div class="hm-lab">Parcours A1</div><div class="hm-val">${Math.round(st.all)} %<small> · ${Math.round(st.tot-st.rem)}/${st.tot}</small></div>${bar(st.all)}<div class="hm-sub">${E?`⏳ ${E.dur} · ${E.date}`:`${st.done}/${st.n} chapitres`}</div></div></div>
  <div class="hm-acts">${acts}<div class="hm-act" onclick="plan()"><span style="font-size:1.4rem">📊</span><div>Mon plan &amp; test · 计划与测试<small>durée estimée, test de niveau</small></div></div></div>`+
  STEPS.map(([t,ids],n)=>`<section class="hm-sec"><h2><span class="hm-n">${n+1}</span>${t}<small>${ids.filter(i=>mastery(unit(i))>=85).length}/${ids.length}</small></h2><div class="hm-grid">${ids.map(tile).join("")}</div></section>`).join("")+`</div>`}
function menu(id){cur=menu;if(id)cat=unit(id);head();crumb([["🏠 Parcours","home"],[cat.name]]);const k=(S.known[cat.id]||[]).length;
  $.innerHTML=`<h2>${cat.icon} ${cat.name}</h2><p style="color:var(--mut)">${k}/${cat.items.length} mots connus · meilleur quiz : ${S.best[cat.id]||0}%</p>${bar(mastery(cat))}
  <div class="tiles"><div class="tile" onclick="list()"><span>📖</span><b>Liste · 词表</b><small>emoji, prononciation, 中文</small></div><div class="tile" onclick="cards()"><span>🃏</span><b>Cartes · 卡片</b><small>retourne et écoute</small></div>
  <div class="tile" onclick="quiz('mix')"><span>❓</span><b>Quiz · 测验</b><small>10 questions</small></div><div class="tile" onclick="quiz('listen')"><span>🎧</span><b>Écoute · 听力</b><small>reconnais le son</small></div>${POSTER[cat.id]?`<div class="tile" onclick="poster()"><span>🖼️</span><b>Affiche · 图片</b><small>l'image du cours</small></div>`:""}</div>`}
function poster(){cur=poster;crumb([["🏠 Parcours","home"],[cat.icon+" "+cat.name,"menu"],["Affiche"]]);$.innerHTML=`<h2>${cat.icon} ${cat.name}</h2><img src="img-fr/${POSTER[cat.id]}.jpg" alt="" style="width:100%;border-radius:12px;box-shadow:0 2px 8px #0003"><div class="nav"><button class="alt" onclick="menu()">◀ Retour</button></div>`}
function list(){cur=list;crumb([["🏠 Parcours","home"],[cat.icon+" "+cat.name,"menu"],["Liste"]]);const kn=S.known[cat.id]||[];
  $.innerHTML=`<h2>${cat.icon} ${cat.name}</h2><p style="color:var(--mut)">Touche l'emoji ou le mot pour écouter 🔊 · coche ✅ les mots que tu connais.</p>`+cat.items.map((it,i)=>`<div class="row"><div class="rv" onclick="say(cat.items[${i}][0])">${it[4]}</div><div class="rt" onclick="say(cat.items[${i}][0])"><b>${it[0]}</b> <span class="ipa">/${it[1]}/</span><small>${it[2]} · ${it[3]}</small></div><input type="checkbox" ${kn.includes(it[0])?"checked":""} onchange="setKnown(cat.id,cat.items[${i}][0],this.checked);head()"></div>`).join("")}
function cards(){cur=cards;crumb([["🏠 Parcours","home"],[cat.icon+" "+cat.name,"menu"],["Cartes"]]);let i=0,flip=false,order=shuffle(cat.items);
  window.cdraw=()=>{const it=order[i],kn=(S.known[cat.id]||[]).includes(it[0]);$.innerHTML=`<div class="top"><span class="pill">${i+1} / ${order.length}</span></div><div class="q" style="min-height:240px;cursor:pointer" onclick="cflip()">${flip?`<div class="zh">${it[2]}</div><div class="ipa">${it[3]}</div><div class="emo">${it[4]}</div>`:`<div class="emo">${it[4]}</div><div class="fw">${it[0]}</div><div class="ipa">/${it[1]}/</div>`}<p style="color:var(--mut)">touche pour retourner · 点击翻转</p></div>
  <div class="nav"><button class="speak" onclick="say('${esc(it[0])}')">🔊</button><button class="alt" onclick="cgo(-1)">◀</button><button class="alt" onclick="cgo(1)">▶</button><button onclick="setKnown(cat.id,'${esc(it[0])}',${!kn});head();cdraw()">${kn?"✅ Connu":"☐ Je connais"}</button></div>`;if(!flip)say(it[0])};
  window.cflip=()=>{flip=!flip;cdraw()};window.cgo=d=>{i=(i+d+order.length)%order.length;flip=false;cdraw()};cdraw()}

/* ---- questions ---- */
const typesFor=mode=>mode==="listen"?["c","d"]:["a","b","c","d","p"];
function mkQ(it,pool,t,c){if(t==="p"&&(it[0].length>24||/[…?!(,]/.test(it[0])))t="b";if(t==="p")return{it,c,t,right:-1,say:it[0]};
  let w=shuffle(pool.filter(x=>x[0]!==it[0]&&x[2]!==it[2]));if(w.length<3)w=w.concat(shuffle(words().flatMap(k=>k.items).filter(x=>x[0]!==it[0]&&x[2]!==it[2]&&!w.includes(x))));
  const opts=shuffle([it,...w.slice(0,3)]);return{it,c,t,opts,right:opts.indexOf(it),say:it[0]}}
function mkPhrase(t){const e=PH[Math.random()*PH.length|0],w=e[0].split("/");
  if(t==="o")return{t,w,full:w.join(" "),ipa:e[1],zh:e[2],pick:[],bank:shuffle(w.map((x,i)=>({x,i}))),right:-1,say:w.join(" ")};
  const idx=Math.random()*w.length|0,ans=w[idx],pool=[...new Set(PH.flatMap(x=>x[0].split("/")).filter(x=>x!==ans))],opts=shuffle([ans,...shuffle(pool).slice(0,3)]);
  return{t:"z",w,ans,full:w.join(" "),ipa:e[1],zh:e[2],sentence:w.map((x,i)=>i===idx?"＿＿":x).join(" "),opts,right:opts.indexOf(ans),say:w.join(" ")}}
function quiz(mode){cur=()=>quiz(mode);const k=S.known[cat.id]||[],pool=shuffle(cat.items).sort((a,b)=>k.includes(a[0])-k.includes(b[0])),ts=typesFor(mode);
  Q={qs:shuffle(pool.slice(0,10)).map(it=>mkQ(it,cat.items,ts[Math.random()*ts.length|0],cat)),i:0,s:0,mode,nw:0};qShow()}
function phrases(){cur=phrases;cat=MODS.phr;crumb([["🏠 Parcours","home"],["Phrases"]]);Q={qs:Array.from({length:10},(_,i)=>mkPhrase(i%2?"o":"z")),i:0,s:0,mode:"phr",nw:0};qShow()}
function revStart(){const d=dueItems().slice(0,15);if(!d.length){toast("✅ Rien à réviser");return}cat=null;cur=null;Q={qs:d.map(({it,c})=>mkQ(it,c.items,typesFor()[Math.random()*5|0],c)),i:0,s:0,mode:"rev",nw:0};qShow()}
function testStart(k){cat=null;cur=null;const qs=[];words().forEach(c=>shuffle(c.items).slice(0,k||1).forEach(it=>{const a=shuffle(typesFor());qs.push(mkQ(it,c.items,a[0],c),mkQ(it,c.items,a[1],c))}));
  Q={qs:[...shuffle(qs),mkPhrase("z"),mkPhrase("z"),mkPhrase("o"),mkPhrase("o")],i:0,s:0,mode:"test",nw:0};qShow()}
const lab=(q,x)=>q.t==="a"||q.t==="c"?`${x[4]} ${x[2]}<small>${x[3]}</small>`:q.t==="b"||q.t==="d"?`${x[4]} ${x[0]}<small>/${x[1]}/</small>`:x;
function qShow(){if(Q.i>=Q.qs.length)return qEnd();Q.lock=0;clearTimeout(Q.tm);const q=Q.qs[Q.i],t=q.t,it=q.it;let p="",o="";
  const spk=`<button class="speak" onclick="say(Q.qs[Q.i].say)">🔊 Écouter · 听</button>`;
  if(t==="a")p=`<div class="emo">${it[4]}</div><div class="fw">${it[0]}</div><div class="ipa">/${it[1]}/</div>${spk}<p>Que signifie ce mot ? · 这个词是什么意思？</p>`;
  else if(t==="b")p=`<div class="emo">${it[4]}</div><div class="zh">${it[2]}</div><div class="ipa">${it[3]}</div><p>Comment dit-on en français ? · 用法语怎么说？</p>`;
  else if(t==="c")p=`<div class="emo">🎧</div>${spk}<p>Qu'as-tu entendu ? (le sens) · 你听到了什么？（意思）</p>`;
  else if(t==="d")p=`<div class="emo">✍️</div>${spk}<p>Dictée : quel mot as-tu entendu ? · 听写：你听到哪个词？</p>`;
  else if(t==="p")p=`<div class="emo">${it[4]}</div><div class="zh">${it[2]}</div>${spk}<p>Écris le mot en français · 写出法语单词</p><input id="inp" class="t" autocomplete="off" autocapitalize="none" placeholder="ex : bonjour" onkeydown="if(event.key==='Enter')pCheck()"><small style="color:var(--mut)">Avec accents = parfait · sans accents = accepté. 带重音最佳，不带也可以。</small><div class="nav"><button onclick="pCheck()">Valider · 确定</button></div>`;
  else if(t==="z")p=`<p style="font-size:1.2rem">${q.zh}</p><div class="fw">${q.sentence}</div><p>Quel mot manque ? · 缺哪个词？</p>`;
  else if(t==="o")p=`<p style="font-size:1.2rem">${q.zh}</p><p>🧩 Remets la phrase en ordre · 排列成正确的句子</p><div id="oq"></div>`;
  if(q.opts)o=`<div class="opts">${q.opts.map((x,k)=>`<button onclick="ans(${k})">${lab(q,x)}</button>`).join("")}</div>`;
  $.innerHTML=`<div class="top"><button class="alt" onclick="clearTimeout(Q.tm);${Q.mode==='test'||Q.mode==='rev'||!Q.mode||Q.mode==='phr'?'home':'menu'}()">✖ Quitter · 退出</button><span class="pill">${Q.i+1} / ${Q.qs.length} · ✔ ${Q.s}</span></div>
  <div class="bar" style="margin-bottom:14px"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
  <div class="q">${p}${o}<div class="nav"><button class="alt" onclick="qDone(false,true,-1)">🤷 Je ne sais pas · 不知道</button></div></div>`;
  if(t==="o")ordDraw();if(t==="p")setTimeout(()=>{const e=document.getElementById("inp");e&&e.focus()},50);if(t==="c"||t==="d")setTimeout(()=>say(q.say),300)}
function ordDraw(){const q=Q.qs[Q.i],el=document.getElementById("oq");if(!el||Q.lock)return;
  el.innerHTML=`<div class="seq">${q.pick.map(x=>`<span class="chip on" onclick="ordUndo(${x.i})">${x.x}</span>`).join("")||"<small style='color:var(--mut)'>Touche les mots dans l'ordre… · 按顺序点击单词</small>"}</div><div class="seq">${q.bank.filter(b=>!q.pick.includes(b)).map(b=>`<span class="chip" onclick="ordPick(${b.i})">${b.x}</span>`).join("")}</div>${q.pick.length===q.w.length?`<div class="nav"><button onclick="ordCheck()">Valider · 确定</button></div>`:""}`}
function ordPick(i){const q=Q.qs[Q.i];if(Q.lock)return;q.pick.push(q.bank.find(b=>b.i===i));ordDraw()}
function ordUndo(i){const q=Q.qs[Q.i];if(Q.lock)return;q.pick=q.pick.filter(x=>x.i!==i);ordDraw()}
function ordCheck(){const q=Q.qs[Q.i];qDone(q.pick.every((x,k)=>x.i===k),false,-1)}
function pCheck(){if(Q.lock)return;const q=Q.qs[Q.i],v=document.getElementById("inp").value.trim();if(!v)return;q.note="";
  const st=x=>x.normalize("NFC").toLowerCase().replace(/[’]/g,"'").replace(/\s+/g," ").trim(),parts=q.it[0].split(" / ");let ok=false;
  if(parts.some(p=>st(v)===st(p))||st(v)===st(q.it[0]))ok=true;else if(parts.some(p=>norm(v)===norm(p))||norm(v)===norm(q.it[0])){ok=true;q.note="Bonnes lettres ! Pour être parfait : "+q.it[0]+" · 字母正确！完整写法："+q.it[0]}qDone(ok,false,-1)}
function ans(k){qDone(k===Q.qs[Q.i].right,false,k)}
function evid(it,cid,t,ok){const k=nk(it[0]);if(!ok){delete S.ev[k];return false}const a=S.ev[k]||[];if(!a.includes(t))a.push(t);S.ev[k]=a;
  if(a.length>=2&&!(S.known[cid]||[]).includes(it[0])){setKnown(cid,it[0],true);return true}return false}
function fb(q,good,skip){let h;
  if(q.it){const it=q.it,kn=(S.known[q.c.id]||[]).includes(it[0]),e=S.ev[nk(it[0])]||[];
    h=`${it[4]} <b>${it[0]}</b> <span class="ipa">/${it[1]}/</span> · ${it[2]} <span class="ipa">${it[3]}</span><div class="evd">${kn?"✅ Mot connu · 已掌握":good?"🔎 Confirmation "+e.length+"/2 : réussis-le dans un autre type de question · 再答对另一种题型即可掌握":"↺ Ce mot reviendra en révision · 这个词会再出现"}</div>`}
  else h=`<b>${q.full}</b><div class="ipa">/${q.ipa}/</div><div>${q.zh}</div>`;
  return`<div class="fb">${skip?"🤷 Pas de souci, voici la réponse · 没关系，答案是：<br>":good?"✔ ":"❌ Voici la bonne réponse · 正确答案：<br>"}${h}${q.note?`<div class="evd">💡 ${q.note}</div>`:""}${good?"":`<div class="nav"><button onclick="qNext()">Suivant · 下一题 ▶</button></div>`}</div>`}
function qDone(ok,skip,k){const q=Q.qs[Q.i];if(Q.lock)return;Q.lock=1;clearTimeout(Q.tm);
  const bs=document.querySelectorAll(".opts button");bs.forEach(b=>b.disabled=true);
  if(bs.length&&q.right>=0){if(k>=0&&bs[k])bs[k].classList.add(ok?"ok":"bad");bs[q.right].classList.add("ok")}
  const good=ok&&!skip;q.good=good;q.skip=!!skip;
  if(skip)beep(0);else{beep(ok);if(ok){Q.s++;Q.c=(Q.c||0)+1;addXp(10)}else Q.c=0}
  if(q.it){srs(q.it[0],good);if(!good&&Q.mode==="rev"&&!q.rq){const n2=mkQ(q.it,q.c.items,typesFor()[Math.random()*5|0],q.c);n2.rq=1;Q.qs.push(n2)}
    if(evid(q.it,q.c.id,q.t,good)){Q.nw++;addXp(3);toast("✅ Mot confirmé · 已掌握 : "+q.it[0]);setTimeout(checkDone,700)}}
  else if(good){S.phr=(S.phr||0)+1;setTimeout(checkDone,700)}
  if(!skip){fxEl(bs[k]||document.querySelector(".q"),ok,Q.c>=3?"🔥 x"+Q.c:"+10 ⭐");if(ok&&Q.c===3)toast("🔥 Série de 3 !");if(ok&&Q.c===5){fanfare();toast("🔥🔥 5 d'affilée !")}}
  save();const box=document.querySelector(".q");box.querySelectorAll(":scope>.nav").forEach(e=>e.remove());box.insertAdjacentHTML("beforeend",fb(q,good,skip));
  say(q.say);Q.tm=setTimeout(qNext,good?1500:60000)}
function qNext(){clearTimeout(Q.tm);Q.i++;qShow()}
function qEnd(){const pct=Math.round(Q.s/Q.qs.length*100);
  if(Q.mode==="mix")S.best[cat.id]=Math.max(S.best[cat.id]||0,pct);
  if(Q.mode==="test")return testEnd();
  if(pct>=80)celebrate("🏆 "+pct+" % !");save();checkDone();head();
  const again=Q.mode==="rev"?"revStart()":Q.mode==="phr"?"phrases()":`quiz('${Q.mode}')`;
  $.innerHTML=`<div class="q"><div class="emo">${pct>=80?"🏆":pct>=50?"👏":"💪"}</div><h2>${Q.s} / ${Q.qs.length}</h2><p>${Q.nw?Q.nw+" mot(s) confirmé(s) ✅ · ":""}${pct>=80?"Excellent ! 太棒了！":pct>=50?"Bien joué ! 不错！":"Continue ! 加油！"}</p><div class="nav"><button onclick="${again}">🔁 Rejouer · 再来</button><button class="alt" onclick="${cat&&Q.mode!=='rev'&&Q.mode!=='phr'?'menu()':'home()'}">Menu</button></div></div>`}
function testEnd(){const per={};Q.qs.forEach(q=>{if(!q.it)return;const c=per[q.c.id]=per[q.c.id]||{},w=c[nk(q.it[0])]=c[nk(q.it[0])]||{ok:0,n:0};w.n++;if(q.good)w.ok++});
  let conf=0,tot=0;Object.entries(per).forEach(([id,ws])=>{const a=Object.values(ws),n=a.length,cf=a.filter(w=>w.ok===w.n).length;conf+=cf;tot+=n;S.test[id]=100*cf/(n+2)});
  S.testDate=new Date().toLocaleDateString("fr-FR");save();checkDone();head();
  $.innerHTML=`<div class="q" style="text-align:left"><div class="emo" style="text-align:center">📊</div><h2 style="text-align:center">Résultat du test · 测试结果</h2><p>📚 <b>Vocabulaire</b> : ${conf} mots confirmés sur ${tot} testés (2 types de questions par mot).</p><p>🧩 Score total : ${Q.s} / ${Q.qs.length}</p><small style="color:var(--mut)">Ton estimation de durée est mise à jour. · 预计学习时间已更新。</small><div class="nav"><button onclick="plan()">📊 Mon plan</button><button class="alt" onclick="home()">🏠 Accueil</button></div></div>`}

/* ---- plan ---- */
const PACE={day:[1,2,3,4,5,6,8,10,12,15,20,25,30],week:[5,7,10,14,20,25,30,40,50,70,100]};
function setPace(v){S.pace=+v;save();plan()}function setUnit(u){S.unit=u;S.pace=u==="week"?30:5;save();plan()}
const lvl=m=>m<30?["À démarrer","#e63946"]:m<60?["En cours","#f4a300"]:m<85?["Presque","#457b9d"]:["Acquis","#2bb673"];
function plan(){cur=plan;cat=null;head();crumb([["🏠 Parcours","home"],["Mon plan"]]);const st=stats(),E=eta(st),u=S.unit,v=S.pace;
  $.innerHTML=`<h2>📊 Mon plan vers l'A1 · 我的A1计划</h2><div class="q" style="text-align:left"><div style="display:flex;justify-content:space-between"><b>Ce que tu maîtrises</b><b>${Math.round(st.tot-st.rem)} / ${st.tot}</b></div><div class="bar" style="height:12px"><i style="width:${(st.tot-st.rem)/st.tot*100}%"></i></div>
  <p>🎯 Je veux apprendre <select onchange="setPace(this.value)">${PACE[u].map(x=>`<option ${x===v?"selected":""} value="${x}">${x} mots</option>`).join("")}</select> <select onchange="setUnit(this.value)"><option value="day" ${u==="day"?"selected":""}>par jour</option><option value="week" ${u==="week"?"selected":""}>par semaine</option></select></p>
  ${E?`<p style="font-size:1.15rem">⏳ A1 maîtrisé dans <b>${E.dur}</b><br>📅 vers le <b>${E.date}</b></p><small style="color:var(--mut)">Calcul : mots restants ÷ mots par jour, +25 % de révision.</small>`:`<p>🎉 <b>Niveau A1 atteint !</b></p>`}</div>
  <div class="tiles"><div class="tile" onclick="testStart(1)"><span>⚡</span><b>Test rapide · 快速测试</b><small>1 mot par thème, testé 2 fois${S.testDate?" · dernier : "+S.testDate:""}</small></div><div class="tile" onclick="testStart(2)"><span>📝</span><b>Test complet · 完整测试</b><small>2 mots par thème</small></div></div>
  <div class="nav" style="justify-content:flex-start"><button class="alt" onclick="resetAll()">🔄 Tout réinitialiser</button></div><h3>Ton parcours · 学习路径</h3>`+
  st.rows.map(({c,m,rem})=>{const[l,col]=lvl(m);return`<div class="rowp" onclick="openAny('${c.id}')"><div class="rv" style="font-size:1.6rem">${c.icon}</div><div class="rt"><b style="font-size:.95rem">${c.name}</b><div class="bar" style="height:5px"><i style="width:${m}%;background:${col}"></i></div></div><div style="text-align:right;font-size:.75rem"><b style="color:${col}">${l}</b><br>${Math.round(m)} % · ${rem>=.5?"~"+Math.ceil(rem)+" restants":"✔"}</div></div>`}).join("")}
function resetAll(){if(!confirm("Tout réinitialiser ? (les XP sont conservés)"))return;S.known={};S.best={};S.test={};S.done={};S.rev={};S.ev={};S.phr=0;S.testDate="";save();home()}
try{speechSynthesis.getVoices()}catch(e){}
touchStreak();home();
</script></body></html>
